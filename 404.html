<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Halaman tidak ditemukan — Achmad Gandhi</title>
  <style>
    html{background:#f3f4f7;color:#2b3552;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{max-width:34rem}
    h1{margin:0 0 .5rem;font-size:clamp(2rem,6vw,3rem);line-height:1.05;color:#101b38}
    p{margin:0 0 1.5rem;line-height:1.6}
    a{display:inline-block;padding:.85rem 1.4rem;border-radius:10px;background:#c2524e;color:#fff;font-weight:600;text-decoration:none}
    a:hover{background:#a63c38}
    a:focus-visible{outline:3px solid #101b38;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang Anda buka tidak ada di website ini. Website ini hanya terdiri dari satu halaman, jadi semua informasi ada di beranda.</p>
    <a id="home" href="./">Kembali ke beranda</a>
  </main>
  <script>
    // Nilai __BASE__ diisi otomatis oleh workflow GitHub Actions (nama repository).
    var base = "__BASE__";
    if (base.indexOf("__") === 0) base = "./";
    document.getElementById("home").setAttribute("href", base);
  </script>
</body>
</html>
